name: Deploy Container to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing ECR image tag to deploy (rollback). Leave empty to build the current commit.'
        required: false
        default: ''

concurrency:
  group: deploy-container
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Quality gate
        run: |
          npm ci
          npm run test:unit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        if: ${{ inputs.image_tag == '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/astro-blog:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/astro-blog:$IMAGE_TAG"

      - name: Choose image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: echo "value=${INPUT_TAG:-$COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS with CDK
        working-directory: cdk
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          npm ci
          npx cdk deploy ContainerStack --require-approval never -c imageTag="$IMAGE_TAG"
