name: Deploy Static Site

# Paused: the app now builds as an SSR server (see docs/adr/ADR-001), so an
# automatic upload of dist/ to S3 would break the live static site.
# Run manually only, until the container deployment replaces it.
on:
  workflow_dispatch:

concurrency:
  group: deploy-static
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and build the site
        run: |
          npm ci
          npm run build

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy with CDK
        run: npx cdk deploy --require-approval never
        working-directory: cdk